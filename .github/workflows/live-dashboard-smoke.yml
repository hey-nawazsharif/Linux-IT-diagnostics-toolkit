name: Live OpsPulse mobile dashboard smoke checks
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/app.js'
      - '.github/workflows/live-dashboard-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-deployed-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify latest public HTML and JavaScript asset
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hey-nawazsharif.github.io/Linux-IT-diagnostics-toolkit'
          fresh=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 15 "$BASE/?build=20261123-1" -o /tmp/opspulse.html &&
               grep -Fq 'v0.5' /tmp/opspulse.html &&
               grep -Fq 'id="quick-result"' /tmp/opspulse.html &&
               grep -Fq 'id="download-link"' /tmp/opspulse.html &&
               grep -Fq 'id="action-plan-list"' /tmp/opspulse.html &&
               grep -Fq 'System diagnostics' /tmp/opspulse.html &&
               grep -Fq 'class="rail"' /tmp/opspulse.html; then
              fresh=1
              break
            fi
            echo "Awaiting Pages propagation (attempt $attempt)"
            sleep 5
          done
          test "$fresh" -eq 1 || { echo 'Live website still missing latest mobile dashboard'; exit 1; }
          echo 'PASS: latest mobile dashboard HTML live'
          curl --fail --silent --show-error --location --max-time 20 "$BASE/app.js?v=20261123-1" -o /tmp/opspulse.js
          grep -Fq 'invalidatePriorExport' /tmp/opspulse.js
          grep -Fq 'FileReader' /tmp/opspulse.js
          grep -Fq 'renderActionPlan' /tmp/opspulse.js
          grep -Fq 'Save JSON file or copy the JSON' /tmp/opspulse.js
          echo 'PASS: versioned app JavaScript deployed with Safari fixes'
          curl --fail --silent --show-error --location --max-time 20 "$BASE/report.json?v=20261123-1" -o /tmp/opspulse.json
          python3 - <<'PY'
          import json
          with open('/tmp/opspulse.json') as f: data=json.load(f)
          assert data['mode']=='SIMULATED DEMO'
          assert len(data['checks'])==8
          assert data['schema_version']=='1.1'
          assert len(data['action_plan'])==2
          print('PASS: labelled fictional JSON sample live')
          PY
