name: Linux diagnostics CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax check
        run: python -m compileall -q opspulse tests
      - name: Linux diagnostics Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check docs/app.js
      - name: Test scenarios, report parsing and interactive UI contract
        run: node --test tests/dashboard.test.cjs
      - name: Exercise real browser UI (Chromium)
        run: python tests/browser_smoke.py
      - name: Generate clearly marked fictional offline CLI report
        run: python -m opspulse --demo --out-dir reports/demo
      - name: Validate generated demo metadata and hosted interactive demo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          offline = json.loads(Path('reports/demo/report.json').read_text())
          assert offline['mode'] == 'SIMULATED DEMO'
          assert offline['summary']['warn'] >= 1
          assert '<style>' in Path('reports/demo/index.html').read_text()
          assert 'IP addresses' in offline['privacy']
          website = Path('docs/index.html').read_text()
          sample = json.loads(Path('docs/report.json').read_text())
          assert sample['mode'] == 'SIMULATED DEMO'
          assert 'id="run"' in website
          assert 'id="report-file"' in website
          assert 'src="./app.js?v=20261122-4"' in website
          assert 'id="quick-result"' in website
          assert 'id="download-link"' in website
          assert 'id="action-plan-list"' in website
          assert sample['schema_version'] == '1.1'
          assert [a['priority'] for a in sample['action_plan']] == ['warn', 'verification']
          assert Path('docs/app.js').exists()
          print('PASS: standalone CLI report and interactive GitHub Pages demo are distinct and valid')
          PY
      - name: Read-only diagnostics of temporary GitHub Linux runner
        run: python -m opspulse --out-dir reports/live-runner
      - name: Verify live Linux collector report contains new checks and action plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/live-runner/report.json').read_text())
          html=Path('reports/live-runner/index.html').read_text()
          assert report['mode']=='LIVE LOCAL LINUX'
          assert report['schema_version']=='1.1'
          keys={c['key'] for c in report['checks']}
          assert {'cpu','ram','swap','disk','inodes','uptime','interfaces','backup'} <= keys
          assert report['summary']['skip'] >= 1
          assert report['action_plan'][-1]['priority']=='verification'
          assert 'Recommended troubleshooting next steps' in html
          assert 'id="action-plan"' in html
          assert 'Read-only' in html
          assert '<script src=' not in html
          print('PASS: real temporary Linux runner has inode/swap counters and actionable JSON/HTML triage')
          PY
      - name: Upload fictional demo and interactive viewer only
        uses: actions/upload-artifact@v4
        with:
          name: clearly-labelled-fictional-demo
          path: |
            docs/index.html
            docs/app.js
            docs/report.json
            reports/demo/index.html
            reports/demo/report.json
          if-no-files-found: error
